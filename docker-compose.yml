services:
  db_dev:
    build:
      context: postgres
      target: database
    container_name: btu-db-dev
    env_file:
      - ./postgres/database_dev.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready', '-d', 'service_core']
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 5s
    ports:
      - 5433:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    profiles:
      - dev
      - test
 
  
  api_dev:
    build:
      context: backend
      target: backend_debug
    container_name: btu-api-dev
    depends_on:
      db_dev:
        condition: service_healthy
    env_file:
      - ./backend/backend_dev.env
    environment:
      ENV: DEV
      PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      API_PATH:
    ports:
      - 8000:8000
    profiles:
      - dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./backend/utils:/app/utils
